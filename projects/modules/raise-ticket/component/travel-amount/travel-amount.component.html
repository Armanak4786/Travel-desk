<form [formGroup]="advanceForm">
  <div class="surface-card shadow-2 border-round p-4 pb-0 mb-3 bg-white justify-content-between w-full">
    <div class="text-xs font-bold text-primary mb-4">
      Advance Amount / Cash Details
    </div>

    <div formArrayName="advanceDetails">
      <div
        *ngFor="let item of advanceDetails.controls; let i = index"
        [formGroupName]="i"
        class="relative mb-4"
      >
        <button
          *ngIf="advanceDetails.length > 1"
          pButton
          icon="pi pi-trash"
          class="p-button-rounded p-button-text p-button-danger absolute"
          style="
            right: -1rem;
            top: 0.5rem;
            width: 2rem;
            height: 2rem;
            z-index: 10;
          "
          (click)="removeAdvanceItem(i)"
        ></button>

        <div class="formgrid grid gap-4 align-items-end">
          <div class="field col-12 md:col-2 mb-0">
            <label class="block text-xs text-500 mb-1">Date</label>
            <p-calendar
              formControlName="advanceDate"
              dateFormat="d M y"
              placeholder="Select Date"
              [showIcon]="true"
              styleClass="w-full underline-icon-calendar"
              inputStyleClass="w-full text-sm font-medium"
              appendTo="body"
            >
            </p-calendar>
          </div>

          <div class="field col-12 md:col-2 mb-0 ml-2">
            <label class="block text-xs text-500 mb-1"
              >Advance Cash/Forex Card</label
            >
            <p-dropdown
              [options]="advanceTypeOptions"
              formControlName="advanceType"
              placeholder="Select"
              styleClass="w-full text-sm border-bottom-1 border-noround border-x-none border-top-none shadow-none pl-0"
            >
            </p-dropdown>
          </div>

          <div class="field col-12 md:col-2 mb-0 ml-2">
            <label class="block text-xs text-500 mb-1">Currency</label>
            <p-dropdown
              [options]="currencyOptions"
              formControlName="currency"
              optionLabel="label"
              optionValue="value"
              placeholder="Select"
              styleClass="w-full text-sm border-bottom-1 border-noround border-x-none border-top-none shadow-none pl-0"
            >
            </p-dropdown>
          </div>

          <div class="field col-12 md:col-2 mb-0 ml-2">
            <label class="block text-xs text-500 mb-1">Amount</label>
            <number
              formControlName="amount"
              class="input-text-left">
          </number>
          </div>

          <div class="field col-12 md:col-2 mb-0 ml-2">
            <label class="block text-xs text-500 pb-1">Amount in INR</label>
            <amount
            class="input-text-left no-underline"
            [value]="item.get('amountInINR')?.value">
            </amount>
          </div>
        </div>
      </div>
    </div>

    <div class="pb-3 mt-2">
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Add More"
        class="p-button-text text-teal-600 font-bold hover:bg-transparent pl-0 text-sm"
        (click)="addAdvanceItem()"
      ></button>
    </div>
  </div>
</form>
