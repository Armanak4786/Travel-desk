<form [formGroup]="visaForm" class="p-4 bg-white shadow-2 border-round mb-5">

  <div class="text-teal-700 mb-3 font-bold text-sm">Upload Documents (If Visa Required)</div>

  <div class="flex flex-row w-full gap-4 align-items-start">
      
    <div class="w-4 flex-none" *ngIf="!viewOnly">
      <div 
        class="upload-box flex flex-column align-items-center justify-content-center cursor-pointer hover:surface-50 transition-colors"
        (click)="fileInput.click()">
        
        <i class="pi pi-upload text-teal-500 text-xl mb-2"></i>
        <span class="text-teal-500 font-medium">Upload</span>
        
        <input 
          #fileInput 
          type="file" 
          (change)="onFileSelect($event)" 
          style="display: none;" 
          accept=".pdf,.jpg,.png,.jpeg"
        >
      </div>
    </div>

    <div class="flex-1 min-w-0"> 
      
      <div *ngIf="uploadedFiles.length === 0" class="h-6rem flex align-items-center text-500 font-italic text-sm pl-2">
        No documents uploaded yet.
      </div>

      <div class="flex flex-column gap-2">
        
        <div *ngFor="let file of uploadedFiles; let i = index" 
             class="flex align-items-center surface-50 border-round p-2 w-full">
          
          <div class="text-900 text-sm font-medium white-space-nowrap overflow-hidden text-overflow-ellipsis flex-shrink-1 mr-3" 
               pTooltip="{{file.name}}" tooltipPosition="top">
            {{ file.name }}
          </div>

          <div class="flex gap-2 flex-shrink-0 align-items-center">
            
            <i class="pi pi-eye text-teal-500 cursor-pointer hover:text-teal-700 transition-colors" 
               pTooltip="View" tooltipPosition="top" (click)="viewFile(file)"></i>

            <i class="pi pi-download text-teal-500 cursor-pointer hover:text-teal-700 transition-colors" 
               pTooltip="Download" tooltipPosition="top" (click)="downloadFile(file)"></i>

            <i class="pi pi-trash text-500 cursor-pointer hover:text-red-500 transition-colors" 
               pTooltip="Delete" tooltipPosition="top" (click)="removeFile(i)"></i>
          </div>

        </div>
      </div>
    </div>

  </div>

</form>
