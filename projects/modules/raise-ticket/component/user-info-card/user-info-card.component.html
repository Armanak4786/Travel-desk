<gen-card class="user-info-card form-section">
  <ng-container body>
    <div class="p-fluid flex justify-content-between align-items-center flex-wrap gap-4">
      
      <div class="flex align-items-center">
        <img
          [src]="userInfo?.avatar || 'https://placehold.co/40x40/E0E0E0/757575?text=PS'"
          alt="User Avatar"
          class="border-circle mr-3"
          style="width: 40px; height: 40px;"
        />
        <div class="text-sm">
          Employee Name:
          <span class="font-bold text-color">{{ userInfo?.name || 'N/A' }}</span>
        </div>
      </div>

      <div class="text-sm">
        Employee ID:
        <span class="font-bold text-color">{{ userInfo?.employeeId || 'N/A' }}</span>
      </div>

      <div class="text-sm">
        Department:
        <span class="font-bold text-color">{{ userInfo?.department || 'N/A' }}</span>
      </div>

      <div class="text-sm">
        Grade:
        <span class="font-bold text-color">{{ userInfo?.grade || 'N/A' }}</span>
      </div>

      <div class="text-sm">
        Designation:
        <span class="font-bold text-color">{{ userInfo?.designation || 'N/A' }}</span>
      </div>

    </div>
  </ng-container>
</gen-card>
