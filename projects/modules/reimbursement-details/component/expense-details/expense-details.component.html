<form [formGroup]="expenseForm">
  <div class="surface-card shadow-2 border-round p-4 pb-0 mb-3 bg-white w-full">
    <div class="text-xs font-bold text-primary mb-4">Expense Details</div>

    <div formArrayName="expenseDetails">
      <div
        *ngFor="let item of expenseDetails.controls; let i = index"
        [formGroupName]="i"
        class="relative mb-4"
      >
        <button
          *ngIf="expenseDetails.length > 1 && !expenseForm.disabled"
          pButton
          icon="pi pi-trash"
          class="p-button-rounded p-button-text p-button-danger absolute"
          style="
            right: -1.5rem;
            top: 0.5rem;
            width: 2rem;
            height: 2rem;
            z-index: 10;
          "
          (click)="removeExpenseItem(i)"
        ></button>

        <div class="flex flex-column md:flex-row gap-3 align-items-end">
          <div class="flex-1 w-full" style="flex: 1.2">
            <label class="block text-xs text-500 mb-1">Date</label>
            <p-calendar
              formControlName="expenseDate"
              dateFormat="dd/mm/yy"
              placeholder="DD/MM/YYYY"
              [showIcon]="true"
              styleClass="w-full underline-icon-calendar"
              inputStyleClass="w-full text-sm font-medium"
              appendTo="body"
            >
            </p-calendar>
          </div>

          <div class="flex-1 w-full" style="flex: 1">
            <label class="block text-xs text-500 mb-1"
              >Reimbursement Type</label
            >
            <p-dropdown
              [options]="reimbursementTypeOptions"
              formControlName="reimbursementType"
              placeholder="Select"
              styleClass="w-full text-sm underline-dropdown"
            >
            </p-dropdown>
          </div>

          <div class="flex-1 w-full" style="flex: 2">
            <label class="block text-xs text-500 mb-1">Particulars</label>
            <input
              pInputText
              type="text"
              formControlName="particulars"
              class="w-full text-sm underline-input text-900 font-medium pb-2"
            />
          </div>

          <div
            class="flex-1 w-full flex align-items-end pb-1"
            style="flex: 1.2"
          >
            <div class="w-full">
              <label class="block text-xs text-500 mb-2"
                >Attach Bill/Invoice</label
              >

              <p-fileUpload
                *ngIf="!item.get('billFile')?.value && !expenseForm.disabled"
                mode="basic"
                chooseLabel="Upload"
                name="bills"
                accept="image/*,application/pdf"
                maxFileSize="1000000"
                (onSelect)="onFileSelect($event, i)"
                chooseIcon="pi pi-paperclip"
                styleClass="dashed-upload-btn w-full"
              >
              </p-fileUpload>

              <div
                *ngIf="item.get('billFile')?.value"
                class="file-chip w-full justify-content-between align-items-center px-2 py-1 bg-teal-50 border-round"
              >
                <span
                  class="white-space-nowrap overflow-hidden text-overflow-ellipsis text-sm text-teal-800"
                  style="max-width: 70px"
                  [title]="item.get('billFile').value.name"
                >
                  {{ item.get("billFile").value.name }}
                </span>

                <div class="flex gap-2 align-items-center">
                  <i
                    class="pi pi-eye text-teal-600 cursor-pointer hover:text-teal-800 text-xs"
                    pTooltip="View File"
                    tooltipPosition="top"
                    (click)="viewFile(item.get('billFile').value)"
                  >
                  </i>

                  <i
                    class="pi pi-times text-red-400 cursor-pointer hover:text-red-600 text-xs"
                    *ngIf="!expenseForm.disabled"
                    (click)="removeFile(i)"
                  >
                  </i>
                </div>
              </div>

              <div
                *ngIf="!item.get('billFile')?.value && expenseForm.disabled"
                class="text-sm text-500 mt-2 font-italic"
              >
                No Attachment
              </div>
            </div>
          </div>

          <div class="flex-1 w-full" style="flex: 0.8">
            <label class="block text-xs text-500 mb-1">Amount</label>
            <p-dropdown
              [options]="currencyOptions"
              formControlName="currency"
              optionLabel="label"
              optionValue="value"
              placeholder="Cur"
              styleClass="w-full text-sm underline-dropdown"
            >
            </p-dropdown>
          </div>

          <div class="flex-1 w-full" style="flex: 0.8">
            <number formControlName="amount" class="w-full input-text-left">
            </number>
          </div>

          <div class="flex-1 w-full" style="flex: 1">
            <label class="block text-xs text-500 mb-1 pb-2">Forex Rate</label>
            <amount formControlName="forexRate" class="w-full input-text-left">
            </amount>
          </div>

          <div class="flex-1 w-full" style="flex: 1">
            <label class="block text-xs text-500 mb-1 pb-2">INR</label>
            <div
              class="text-sm font-medium text-900 pb-2 surface-border w-full"
            >
              {{ item.get("inrAmount")?.value | currency : "INR" }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pb-3 mt-4" *ngIf="!expenseForm.disabled">
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Add More"
        class="p-button-text text-teal-600 font-bold hover:bg-transparent pl-0 text-sm"
        (click)="addExpenseItem()"
      ></button>
    </div>

    <div class="flex justify-content-end pt-2 pb-4 pr-5">
      <div class="grid w-full md:w-6 lg:w-4">
        <div class="col-8 text-right text-sm font-bold text-900">
          Total Expenses
        </div>
        <div class="col-4 text-left pl-3 text-sm font-bold text-900">
          {{ totalExpenses | currency : "INR" }}
        </div>

        <div class="col-8 text-right text-xs text-500 mt-1">
          Advance Amount (AED 20)
        </div>
        <div class="col-4 text-left pl-3 text-xs text-500 mt-1">
          -{{ advanceAmount | currency : "INR" }}
        </div>
      </div>
    </div>
  </div>
</form>
