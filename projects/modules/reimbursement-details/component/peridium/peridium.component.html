<form [formGroup]="peridiumForm">
  <div class="surface-card shadow-2 border-round p-4 pb-0 mb-3 bg-white w-full">
    <div class="text-xs font-bold text-primary mb-4">Per Diem</div>

    <div formArrayName="peridiumDetails">
      <div
        *ngFor="let item of peridiumDetails.controls; let i = index"
        [formGroupName]="i"
        class="relative mb-4"
      >
        <div class="formgrid grid gap-4 align-items-end">
          <div class="col-1 mb-0">
            <label class="block text-xs text-500 mb-2">No of days</label>
            <p-dropdown
              [options]="daysOptions"
              formControlName="noOfDays"
              placeholder="Select"
              styleClass="text-sm underline-dropdown"
            >
            </p-dropdown>
          </div>

          <div class="col-2 mb-0">
            <label class="block text-xs text-500 mb-2">Per Day Allowance</label>
            <div class="flex gap-2 w-full">
              <div style="width: 5rem">
                <p-dropdown
                  [options]="currencyOptions"
                  formControlName="currency"
                  optionLabel="label"
                  optionValue="value"
                  styleClass="w-full text-sm underline-dropdown"
                >
                </p-dropdown>
              </div>
              <div class="ml-2">
                <number
                  formControlName="perDayAllowance"
                  class="input-text-left per-day-allowance-input"
                >
                </number>
              </div>
            </div>
          </div>

          <div class="col-2 mb-0 w-10rem">
            <label class="block text-xs text-500 mb-2 pb-2">Total</label>
            <div
              class="text-sm text-900 font-medium pb-2 surface-border w-full white-space-nowrap"
            >
              <span class="mr-1">{{ item.get("currency")?.value }}</span>
              {{ item.get("totalAmount")?.value | number : "1.2-2" }}
            </div>
          </div>
          <div class="col-1 mb-0">
            <label class="block text-xs text-500 mb-0 pb-2">Forex Rate</label>
            <amount formControlName="forexRate" class="input-text-left">
            </amount>
          </div>
          <div class="col-2 mb-0 w-10rem">
            <label class="block text-xs text-500 mb-0 pb-2">INR</label>
            <amount
              formControlName="inrAmount"
              class="input-text-left no-underline"
              [value]="item.get('inrAmount')?.value"
            >
            </amount>
          </div>

          <div
            class="field col-12 md:col-1 mb-0 flex justify-content-center pb-1"
          >
            <button
              *ngIf="!peridiumForm.disabled && peridiumDetails.length > 1"
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-text p-button-danger w-2rem h-2rem"
              (click)="removePeridiumItem(i)"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <div class="pb-3 mt-4">
      <button
        pButton
        *ngIf="!peridiumForm.disabled"
        type="button"
        icon="pi pi-plus"
        label="Add More"
        class="p-button-text text-teal-600 font-bold hover:bg-transparent pl-0 text-sm"
        (click)="addPeridiumItem()"
      ></button>
    </div>
  </div>
</form>
