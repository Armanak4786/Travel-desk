<div class="raise-ticket-page p-4">
   <div class="w-full flex justify-content-between align-items-center mb-2">
    <div>
    <a href="/dashboard"><span class="text-color-secondary text-sm mb-2">Home > </span></a>
      <span class="text-900 font-medium">Request No. {{ requestId }}</span>
  </div>
  </div>


  <app-user-info-card [userInfo]="(userInfo$ | async)" class="w-full block">
  </app-user-info-card>

  <div class="w-full pt-4">
    <gen-button
      [btnLabel]="'Travel Details'"
      (onClick)="activeTab = 'travel'"
      [btnType]="activeTab === 'travel' ? '' : 'border-btn'"
      class="w-15rem"
    ></gen-button>
    <gen-button
      [btnLabel]="'Reimbursement Details'"
      (onClick)="activeTab = 'reimbursement'"
      [btnType]="activeTab === 'reimbursement' ? '' : 'border-btn'"
      class="w-15rem ml-2"
    ></gen-button>
  </div>
  <div
    *ngIf="activeTab === 'travel'"
    class="w-full fadein animation-duration-300"
  >
    <app-raise-ticket
      [viewOnly]="isViewOnly"
      [currentRole]="userRole"
      [hideLayout]="true"
      [requestData]="requestData"
      class="w-full block"
    >
    </app-raise-ticket>
  </div>

  <div
    *ngIf="activeTab === 'reimbursement'"
    class="w-full fadein animation-duration-300"
  >
    <app-reimbursement-details
      [viewOnly]="isViewOnly"
      [currentRole]="userRole"
      [hideLayout]="true"
      class="w-full block"
    >
    </app-reimbursement-details>
  </div>
</div>
